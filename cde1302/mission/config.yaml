# Mini project mission settings.
# Coordinates are PX4 local NED in metres, origin = takeoff point:
#   x = North (forward if the drone starts facing North), y = East (right).

drone_id: 2

# Search area. PLACEHOLDER numbers: replace with the real area on demo day.
area:
  x_min: 0.0
  x_max: 1.5
  y_min: 0.0
  y_max: 1.0
  margin: 0.2          # keep waypoints this far inside the edges (m)

sweep:
  lane_spacing: 0.6    # distance between lanes (m); measure camera swath in the lab
  lanes_along: x       # "x" = lanes run North-South, "y" = lanes run East-West

# Used only for the time estimate printed by planner.py.
estimate:
  cruise_speed: 0.10   # NAV_CRUISE_SPEED_MS in firmware nav_task.h (m/s)
  turn_time_s: 4.0     # guess for rotate-in-place at each waypoint; measure it
